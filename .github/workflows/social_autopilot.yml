name: Bastet 7/24 Sosyal Medya Otopilot

on:
  schedule:
    # Her gün Türkiye Saati (Europe/Istanbul) ile sabah 10:00 (UTC 07:00)
    - cron: '0 7 * * *'
    # Her gün Türkiye Saati ile akşam 19:00 (UTC 16:00 - Akşam Hikayesi için)
    - cron: '0 16 * * *'
  workflow_dispatch: # GitHub üzerinden manuel 'Run workflow' ile tetikleme imkanı

jobs:
  publish_social:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Yazı Tiplerini (Fonts) Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation

      - name: Ortam Değişkenlerini Tanımla
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          echo "META_ACCESS_TOKEN=$META_ACCESS_TOKEN" > social_automation/.env
          echo "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" >> social_automation/.env
          echo "FACEBOOK_PAGE_ID=$FACEBOOK_PAGE_ID" >> social_automation/.env
          echo "META_API_VERSION=v21.0" >> social_automation/.env

      - name: Bugünün Gönderilerini Canlı Yayınla
        run: |
          python social_automation/daily_runner.py --publish-all
