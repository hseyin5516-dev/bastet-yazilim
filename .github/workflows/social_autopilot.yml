name: Bastet 7/24 Sosyal Medya Otopilot

on:
  schedule:
    # 1. SABAH OTURUMU: Türkiye Saati 10:00 (UTC 07:00) -> 6 Slayt Carousel + Sabah Hikayesi
    - cron: '0 7 * * *'
    # 2. AKŞAM OTURUMU: Türkiye Saati 19:00 (UTC 16:00) -> Tek Görsel Afiş (varsa) + Akşam Hikayesi
    - cron: '0 16 * * *'
  workflow_dispatch: # GitHub üzerinden manuel tetikleme
    inputs:
      session:
        description: 'Çalıştırılacak oturum'
        required: true
        default: 'all'
        type: choice
        options:
          - morning
          - evening
          - all

jobs:
  publish_social:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Yazı Tiplerini (Fonts) Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-liberation

      - name: Ortam Değişkenlerini Tanımla
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          echo "META_ACCESS_TOKEN=$META_ACCESS_TOKEN" > social_automation/.env
          echo "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" >> social_automation/.env
          echo "FACEBOOK_PAGE_ID=$FACEBOOK_PAGE_ID" >> social_automation/.env
          echo "META_API_VERSION=v21.0" >> social_automation/.env

      - name: Sabah 10:00 Gönderilerini Canlı Yayınla (Carousel + Sabah Hikayesi)
        if: github.event.schedule == '0 7 * * *' || github.event.inputs.session == 'morning'
        run: |
          python social_automation/daily_runner.py --publish-morning

      - name: Akşam 19:00 Gönderilerini Canlı Yayınla (Tek Görsel + Akşam Hikayesi)
        if: github.event.schedule == '0 16 * * *' || github.event.inputs.session == 'evening'
        run: |
          python social_automation/daily_runner.py --publish-evening

      - name: Tümünü Yayınla (Manuel All Seçilirse)
        if: github.event.inputs.session == 'all'
        run: |
          python social_automation/daily_runner.py --publish-all
